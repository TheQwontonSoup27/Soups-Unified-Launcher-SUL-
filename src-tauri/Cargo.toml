[package]
name = "sul-tauri"
description = "Tauri container for Soups Unified Launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "sul_lib"

[features]
# `npm run dev -- --features steam` (see README before enabling).
steam = ["sul-launcher/steam"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sul-core.workspace = true
sul-trust.workspace = true
sul-launcher.workspace = true
sul-builds.workspace = true
sul-mod.workspace = true
sul-app.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
# The mock runtime, to send real IPC messages to the commands in tests (no window is opened).
tauri = { version = "2", features = ["test"] }
