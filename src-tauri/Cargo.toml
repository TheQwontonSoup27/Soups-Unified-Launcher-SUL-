[package]
name = "sul-tauri"
description = "Tauri container for Soups Unified Launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "sul_lib"

[features]
# `npm run dev -- --features steam` (see README before enabling).
steam = ["sul-core/steam"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sul-core.workspace = true

[dev-dependencies]
tempfile = "3"
