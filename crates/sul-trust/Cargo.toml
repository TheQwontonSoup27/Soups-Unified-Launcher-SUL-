[package]
name = "sul-trust"
description = "Trust checks for Soups Unified Launcher: SHA-256 build manifests and their verification, integrity assessment, the rule for when SUL may act without asking, webhook-address checking, and blake3 digest verification"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The error type, safe paths and file operations the trust checks use (D-154: this crate sits directly above `sul-core`).
sul-core.workspace = true
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
# The build manifest (`manifest`) and the findings the checks report.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile = "3"
