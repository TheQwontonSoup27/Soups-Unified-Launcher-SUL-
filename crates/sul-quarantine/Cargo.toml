[package]
name = "sul-quarantine"
description = "The quarantine of Soups Unified Launcher: set a file aside where nothing will use it, verified and reversible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
sul-core.workspace = true
# `manifest::hash_file`, the SHA-256 the quarantine proves every copy with (D-154).
sul-trust.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
# The quarantined copy is sealed with XChaCha20-Poly1305 (the vault's cipher, Ch. 2 §2.3) in the STREAM construction
# (D-155). `stream` turns on `aead::stream`; the default `getrandom` feature supplies the operating system's random source
# for fresh keys.
chacha20poly1305 = { workspace = true, features = ["stream"] }
zeroize.workspace = true
# Hashing the plaintext as it is opened, to prove a sealed copy still matches its record.
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
