name: CI
on: [push, pull_request]

# Windows only for now (owner decision 2026-10-22). Scripts are the same ones documented in
# docs/SETUP-WINDOWS.md, so a green run here means those steps work on a clean machine.
jobs:
  # The new design's R0 substrate (CLAUDE.md "R0 Build Order") and the xtask gate runner. Same failure-annotation
  # pattern as `core`. The xtask gates are still thin (see docs/SESSION_STATE.md); this job proves they run on Windows.
  # `cargo xtask ac-regression` includes the network-surface guard (xtask/src/network.rs): it asks cargo for the Windows
  # graph of every shipped package and fails on a network crate outside a declared package, on tokio's `net` feature, on a
  # Windows networking API feature, or on a networking API named in source. It does not look inside WebView2, std or Steam.
  r0-substrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy -p sul-ipc-types -p sul-ring -p sul-wire -p sul-trust -p sul-metrics -p xtask --all-targets --message-format=short -- -D warnings 2>&1 | Tee-Object -FilePath clippy.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 clippy.log; exit $code }
      - name: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test -p sul-ipc-types -p sul-ring -p sul-wire -p sul-trust -p sul-metrics -p xtask 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 test.log; exit $code }
      - name: xtask gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo xtask config-check 2>&1 | Tee-Object -FilePath gates.log
          if ($LASTEXITCODE -eq 0) { cargo xtask electron-audit 2>&1 | Tee-Object -FilePath gates.log -Append }
          if ($LASTEXITCODE -eq 0) { cargo xtask ac-regression 2>&1 | Tee-Object -FilePath gates.log -Append }
          if ($LASTEXITCODE -eq 0) { cargo xtask release-check --release R0 2>&1 | Tee-Object -FilePath gates.log -Append }
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 gates.log; exit $code }

  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # The three cargo steps below name the cause of a failure in an annotation, because the raw
      # logs of a run cannot be downloaded. See .github/scripts/surface-failure.ps1.
      - name: clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy -p sul-core --all-targets --message-format=short -- -D warnings 2>&1 | Tee-Object -FilePath clippy.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 clippy.log; exit $code }
      - name: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test -p sul-core 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 test.log; exit $code }
      # The optional Steamworks attachment must keep compiling. Compile only: its test binaries would
      # link steam_api64.dll and not start without it (see docs/decisions/0003).
      - name: clippy with the steam feature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy -p sul-core --features steam --all-targets --message-format=short -- -D warnings 2>&1 | Tee-Object -FilePath steam.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 steam.log; exit $code }
      # The old "no network crate in sul-core or sul-tauri" step lived here. It is replaced by the declared-surface guard in
      # `cargo xtask ac-regression` (job r0-substrate): Ch. 16 §16.15.14, docs/decisions/0009.

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm test --workspace ui
      - run: npm run ui:build

  tauri-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # The Tauri build script needs the built UI (`frontendDist`).
      - run: npm run ui:build
      - name: clippy and tests for the desktop wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy -p sul-tauri --all-targets --message-format=short -- -D warnings 2>&1 | Tee-Object -FilePath check.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            cargo test -p sul-tauri 2>&1 | Tee-Object -FilePath test.log
            $code = $LASTEXITCODE
          }
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 check.log, test.log; exit $code }
      # clippy only type-checks the app binary, so nothing above links it. build.rs hands the Common
      # Controls v6 manifest to the linker instead of to tauri-build; link the real binary and check
      # that the manifest is in it. (The test executable proves it for itself: it only starts with it.)
      - name: build the app binary and check it carries the manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build -p sul-tauri --message-format=short 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./.github/scripts/surface-failure.ps1 build.log; exit $code }
          $exe = 'target\debug\sul-tauri.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::$exe was not built"; exit 1 }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains('Microsoft.Windows.Common-Controls')) { Write-Host "::error::$exe has no Common Controls manifest"; exit 1 }
          Write-Host "$exe carries the Common Controls v6 manifest"
