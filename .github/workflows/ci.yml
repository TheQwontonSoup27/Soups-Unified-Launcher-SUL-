name: CI
on: [push, pull_request]

# Windows only for now (owner decision 2026-10-22). Scripts are the same ones documented in
# docs/SETUP-WINDOWS.md, so a green run here means those steps work on a clean machine.
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p sul-core --all-targets -- -D warnings
      - run: cargo test -p sul-core
      # The optional Steamworks attachment must keep compiling. Compile only: its test binaries would
      # link steam_api64.dll and not start without it (see docs/decisions/0003).
      - run: cargo clippy -p sul-core --features steam --all-targets -- -D warnings

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm test --workspace ui
      - run: npm run ui:build

  tauri-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # The Tauri build script needs the built UI (`frontendDist`).
      - run: npm run ui:build
      - name: clippy and tests for the desktop wrapper (errors surfaced as annotations)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy -p sul-tauri --all-targets --message-format=short -- -D warnings 2>&1 | Tee-Object -FilePath check.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            cargo test -p sul-tauri 2>&1 | Tee-Object -FilePath test.log -Append
            $code = $LASTEXITCODE
          }
          if ($code -ne 0) {
            $lines = Get-Content check.log, test.log -ErrorAction SilentlyContinue | Where-Object { $_ -match 'error|failed|not found|could not' } | Select-Object -First 12
            foreach ($l in $lines) { Write-Host "::error::$($l -replace '[\r\n%]',' ')" }
            exit $code
          }
