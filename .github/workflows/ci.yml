name: CI
on: [push, pull_request]
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
  tauri-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: cargo check (errors surfaced as annotations)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo check --message-format=short 2>&1 | Tee-Object -FilePath check.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content check.log | Where-Object { $_ -match 'error|failed|not found|could not' } | Select-Object -First 12
            foreach ($l in $lines) { Write-Host "::error::$($l -replace '[\r\n%]',' ')" }
            exit $code
          }
